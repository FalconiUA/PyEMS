scenario:
  control_mode: export_limit
  active_power_limit_w: 100.0
  connection_point_device_id: grid
  unit_device_id: pv
  pid_tuning: auto
  export_priority: 5
  regulation_priority: 10
control:
  fast_cycle_s: 1
  poll_interval_s: 0.5
export_limit:
  limit_w: 100.0
  priority: 5
  connection_point_active_power_channel: grid.W
  unit_active_power_channel: pv.W
  unit_active_power_setpoint_channel: pv.WSet
connection_point_active_power:
  export_limit_w: 100.0
  import_limit_w: 1000000000.0
  priority: 10
  gains:
    kp: 0.4
    ki: 0.08
    kd: 0.0
    tt: 5.0
  connection_point_active_power_channel: grid.W
  unit_active_power_channel: pv.W
  unit_active_power_setpoint_channel: pv.WSet
safety:
  max_comms_age_s: 10
  unit_active_power_setpoint_channels:
  - pv.WSet
allocation:
  channels:
  - setpoint_channel: pv.WSet
    p_min_w: 0
    p_max_w: 100000
    default_w: 100000
    ramp_rate_w_per_s: 100
    deadband_w: 200
    ramp_down_w_per_s: 1000
# Generator minimum load (island operation) — uncomment when the site has a
# genset with its own meter (add the `gen` device below). While the generator
# meter shows the genset running, the unit (PV) is capped so the generator
# never drops below `minimum_load_pct` of its rated ACTIVE power; when the
# grid is back (generator meter ~0 W), the cap is withdrawn and the normal
# export/import program governs alone.
# generator_minimum_load:
#   rated_apparent_power_va: 125000    # S_rated — nameplate apparent power [VA]
#   rated_active_power_w: 100000       # P_rated — nameplate active power [W]
#   minimum_load_pct: 30               # generator floor, % of P_rated
#   generator_active_power_channel: gen.W
#   # unit bindings default to connection_point_active_power's unit (pv.*):
#   # unit_active_power_channel: pv.W
#   # unit_active_power_setpoint_channel: pv.WSet
#   # priority: 5                      # machine-protection band, like export_limit
#   # running_threshold_w: 2000        # default: 2% of P_rated
#   # off_delay_s: 5                   # |P_gen| below threshold this long = stopped
telemetry:
  live_json: logs/live_state.json
events:
  journal_jsonl: logs/events.jsonl
  ui_audit_jsonl: logs/ui_audit.jsonl
devices:
- id: grid
  profile: meters/grid_meter_huawei_smartlogger3000.yaml
  host: 192.168.0.200
  slave_id: 1
- id: pv
  profile: inverters/huawei_sun2000_100ktl_m1.yaml
  host: 192.168.0.100
  slave_id: 1
# Generator meter (uncomment together with generator_minimum_load above):
# - id: gen
#   profile: meters/generator_meter_huawei_smartlogger3000.yaml
#   host: 192.168.0.200
#   slave_id: 2
setpoint_compliance:
  unit_active_power_channel: pv.W
  unit_active_power_setpoint_channel: pv.WSet
  tolerance_w: 2000
  max_violation_s: 30
setpoint_headroom:
  headroom_w: 10000
  headroom_pct: 0
  unit_active_power_channel: pv.W
  unit_active_power_setpoint_channel: pv.WSet
